name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-check:
    name: Lint & import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app

      - name: Check app imports
        # Verifies every module parses and top-level imports resolve.
        # Skips auto_ingest & db startup side-effects (they need a real DB).
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost/ci"
          ANTHROPIC_API_KEY: "sk-placeholder"
          VOYAGE_API_KEY: "pa-placeholder"
          INGEST_API_KEY: "placeholder"
        run: |
          python -c "import app.config"
          python -c "import app.chunking"
          python -c "import app.embeddings"
          python -c "import app.rag"

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost/ci"
          ANTHROPIC_API_KEY: "sk-placeholder"
          VOYAGE_API_KEY: "pa-placeholder"
          INGEST_API_KEY: "placeholder"
        run: pytest
