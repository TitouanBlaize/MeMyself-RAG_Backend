databases:
  - name: rag-db
    plan: free          # bump to "starter" or higher for production
    postgresMajorVersion: "16"

services:
  - type: web
    name: rag-backend
    runtime: python
    plan: free           # free plan spins down after 15 min idle (cold starts)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false        # set manually in the Render dashboard (secret)
      - key: VOYAGE_API_KEY
        sync: false        # set manually in the Render dashboard (secret)
      - key: INGEST_API_KEY
        sync: false        # set manually in the Render dashboard (secret)
